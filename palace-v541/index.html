<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07111d"><title>Palace of Signs · V541</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111c;color:#f5e3aa;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0;display:grid;grid-template-rows:50px 1fr 78px}header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#07111df2;border-bottom:1px solid #c8a852;z-index:9}header b{font-family:Georgia,serif;letter-spacing:.08em}#status{font-size:10px;color:#7fffe8}#stage{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;left:12px;top:12px;display:flex;gap:8px;z-index:5;flex-wrap:wrap}.pill{background:#07111dd9;border:1px solid #c8a852;border-radius:9px;padding:7px 10px;font-size:11px;backdrop-filter:blur(5px)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:7px;padding:8px;background:#07111df2;border-top:1px solid #c8a852}.controls button{border:1px solid #c8a852;background:#10293b;color:#fff0b1;border-radius:11px;font-size:15px;font-weight:700;touch-action:none}.controls button:active{background:#1e5068}.note{position:absolute;right:12px;top:12px;z-index:5;background:#07111dd9;border:1px solid #59d9d3;border-radius:8px;padding:6px 8px;font-size:9px;color:#8fffe9}@media(max-width:700px){header b{font-size:12px}.note{display:none}.pill{font-size:10px;padding:6px 8px}}</style></head><body><div id="app"><header><b>PALACE OF SIGNS · V541</b><span id="status">INITIALISATION…</span></header><div id="stage"><canvas id="game"></canvas><div class="hud"><div class="pill">VIE <span id="life">♥♥♥♥</span></div><div class="pill">ÉCHOS <span id="echo">0</span>/3</div><div class="pill">OBJECTIF <span id="goal">Éveille les miroirs</span></div></div><div class="note">FALLBACK VISUEL INTÉGRÉ · aucun asset externe requis</div></div><div class="controls"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">SAUT</button><button data-k="attack">ATTAQUE</button><button data-k="dash">DASH</button></div></div><script>(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),status=document.getElementById('status'),lifeEl=document.getElementById('life'),echoEl=document.getElementById('echo'),goalEl=document.getElementById('goal');if(!g){status.textContent='CANVAS INDISPONIBLE';return}let W=0,H=0,D=1,last=performance.now(),t=0,cam=0,shake=0;const WORLD=5200,ground=98,keys={left:0,right:0};const segments=[[0,850],[1100,1950],[2220,3150],[3440,4300],[4580,5200]],plats=[{x:900,w:130,y:90},{x:1010,w:100,y:145},{x:1985,w:145,y:95},{x:2120,w:105,y:150},{x:3180,w:130,y:85},{x:3310,w:120,y:145},{x:4340,w:110,y:95},{x:4470,w:100,y:145}],echoes=[{x:690,y:45,on:1},{x:2810,y:52,on:1},{x:4860,y:60,on:1}],enemies=[{x:1380,hp:3,dir:1,kind:0,hit:0},{x:2580,hp:4,dir:-1,kind:1,hit:0},{x:3890,hp:4,dir:1,kind:0,hit:0},{x:4780,hp:6,dir:-1,kind:2,hit:0}];const p={x:170,y:0,vx:0,vy:0,w:36,h:62,on:0,face:1,life:4,atk:0,dash:0,dashCd:0,inv:0,echo:0};function resize(){const r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=Math.max(1,Math.floor(W*D));c.height=Math.max(1,Math.floor(H*D));g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();function action(k,on){if(k==='left'||k==='right'){keys[k]=on?1:0;return}if(!on)return;if(k==='jump'&&p.on){p.vy=-540;p.on=0}if(k==='attack'&&p.atk<=0){p.atk=.22}if(k==='dash'&&p.dashCd<=0){p.dash=.18;p.dashCd=.65;p.vx=p.face*620}}document.querySelectorAll('.controls button').forEach(b=>{const k=b.dataset.k;['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();action(k,1)},{passive:false}));['pointerup','pointercancel','touchend'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();action(k,0)},{passive:false}))});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')action('left',1);if(e.key==='ArrowRight'||e.key==='d')action('right',1);if(e.code==='Space'||e.key==='ArrowUp')action('jump',1);if(e.key.toLowerCase()==='j')action('attack',1);if(e.key==='Shift')action('dash',1)});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')action('left',0);if(e.key==='ArrowRight'||e.key==='d')action('right',0)});function floorTop(){return H-ground}function onSegment(x){for(const s of segments)if(x>=s[0]&&x<=s[1])return true;return false}function reset(){p.life=4;p.x=Math.max(120,p.x-240);p.y=0;p.vx=p.vy=0;p.inv=1}function hurt(kb){if(p.inv>0)return;p.life--;p.inv=1;p.vx=kb;p.vy=-260;shake=8;if(p.life<=0)reset();lifeEl.textContent='♥'.repeat(p.life)+'♡'.repeat(4-p.life)}function update(dt){t+=dt;p.atk=Math.max(0,p.atk-dt);p.dash=Math.max(0,p.dash-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.inv=Math.max(0,p.inv-dt);shake=Math.max(0,shake-dt*24);let m=keys.right-keys.left;if(m)p.face=m;if(p.dash<=0){p.vx+=(m*300-p.vx)*Math.min(1,dt*10);if(!m)p.vx*=Math.pow(.003,dt)}p.vy+=1380*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(0,Math.min(WORLD-p.w,p.x));p.on=0;const floor=floorTop();if(onSegment(p.x+p.w/2)){const top=floor-p.h;if(p.vy>=0&&p.y<=top+24&&p.y+p.h>=top){p.y=top;p.vy=0;p.on=1}}for(const q of plats){if(p.x+p.w>q.x&&p.x<q.x+q.w){const top=floor-q.y-p.h;if(p.vy>=0&&p.y<=top+20&&p.y+p.h>=top){p.y=top;p.vy=0;p.on=1}}}if(p.y>H+160)reset();for(const e of echoes){if(e.on&&Math.abs(p.x+p.w/2-e.x)<54&&Math.abs(p.y+p.h/2-(floor-e.y))<80){e.on=0;p.echo++;echoEl.textContent=p.echo;if(p.echo===3)goalEl.textContent='Atteins le sanctuaire'}}for(const e of enemies){if(e.hp<=0)continue;e.hit=Math.max(0,e.hit-dt);e.x+=e.dir*(e.kind===2?34:52)*dt;if(!onSegment(e.x))e.dir*=-1;const ey=floor-58;if(Math.abs((p.x+p.w/2)-e.x)<48&&Math.abs((p.y+p.h/2)-ey)<60)hurt(p.x<e.x?-300:300);if(p.atk>0&&e.hit<=0&&Math.abs((p.x+p.w/2+p.face*38)-e.x)<75&&Math.abs((p.y+p.h/2)-ey)<75){e.hp--;e.hit=.22;e.x+=p.face*30;p.atk=0;shake=4}}cam+=(Math.max(0,Math.min(WORLD-W,p.x-W*.38))-cam)*Math.min(1,dt*5)}function sky(){const f=floorTop();let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#63c8ef');gr.addColorStop(.45,'#327fa4');gr.addColorStop(1,'#0a3048');g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle='rgba(255,239,179,.72)';g.beginPath();g.arc(W*.78,90,48,0,Math.PI*2);g.fill();g.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<7;i++){let x=(i*210-(cam*.08)%210)-90,y=95+(i%3)*35;g.beginPath();g.ellipse(x,y,90,22,0,0,Math.PI*2);g.fill()}g.save();g.translate(-cam*.12,0);g.fillStyle='rgba(22,73,91,.38)';for(let i=-1;i<12;i++){let x=i*500;g.beginPath();g.moveTo(x,f-45);g.quadraticCurveTo(x+120,f-240,x+250,f-80);g.quadraticCurveTo(x+370,f-210,x+500,f-45);g.lineTo(x+500,f);g.lineTo(x,f);g.fill()}g.restore()}function palaceUnit(b,f,s=1){g.save();g.translate(b,0);g.scale(s,s);const y=f/s;g.fillStyle='#f4e4b9';g.fillRect(70,y-300,280,250);g.strokeStyle='#b78c32';g.lineWidth=5;g.strokeRect(70,y-300,280,250);g.fillStyle='#dfc376';g.fillRect(54,y-314,312,18);g.beginPath();g.moveTo(82,y-314);g.quadraticCurveTo(210,y-445,338,y-314);g.closePath();g.fillStyle='#f5e5bd';g.fill();g.strokeStyle='#b78c32';g.stroke();g.fillStyle='#1b5470';for(let a=0;a<3;a++){let ax=104+a*92;g.beginPath();g.arc(ax+30,y-125,30,Math.PI,0);g.fillRect(ax,y-125,60,78);g.fill();g.strokeStyle='#d8bb61';g.lineWidth=4;g.stroke()}g.fillStyle='#1b5d7d';g.fillRect(180,y-280,60,94);g.strokeStyle='#d9bd66';g.strokeRect(180,y-280,60,94);g.fillStyle='#7fffe8';g.beginPath();g.arc(210,y-238,9,0,Math.PI*2);g.fill();g.fillStyle='#5b2d78';for(let i=0;i<4;i++){g.beginPath();g.arc(92+i*70,y-55-(i%2)*10,10,0,Math.PI*2);g.fill()}g.restore()}function decorations(f){g.save();g.translate(-cam,0);for(let x=180;x<WORLD;x+=520){g.strokeStyle='#b78c32';g.lineWidth=3;g.beginPath();g.moveTo(x,f-185);g.lineTo(x,f-115);g.stroke();g.fillStyle='#f7ce62';g.beginPath();g.arc(x,f-102,10+Math.sin(t*3+x)*2,0,Math.PI*2);g.fill();g.fillStyle='#176a70';g.fillRect(x-3,f-92,6,40);for(let k=0;k<5;k++){g.fillStyle=k%2?'#ef7db5':'#f6d45c';g.beginPath();g.arc(x-22+k*10,f-42-Math.sin(k)*8,5,0,Math.PI*2);g.fill()}}g.restore()}function water(f){g.fillStyle='#075b79';g.fillRect(0,f+8,W,H-f);for(let y=f+14;y<H;y+=15){g.strokeStyle='rgba(118,255,239,.35)';g.lineWidth=2;g.beginPath();for(let x=0;x<=W;x+=28){let yy=y+Math.sin(x*.035+t*2+y)*3;if(x===0)g.moveTo(x,yy);else g.lineTo(x,yy)}g.stroke()}g.globalAlpha=.18;for(let i=0;i<7;i++){g.fillStyle='#f5d96f';g.fillRect((i*170-(cam*.2)%170),f+24,80,2)}g.globalAlpha=1}function terrain(f){g.save();g.translate(-cam,0);for(const s of segments){g.fillStyle='#10293a';g.fillRect(s[0],f,s[1]-s[0],ground+10);g.fillStyle='#e2c56f';g.fillRect(s[0],f,s[1]-s[0],10);for(let x=s[0]+16;x<s[1];x+=36){g.fillStyle=((x/36|0)%2)?'#2aa5aa':'#705294';g.beginPath();g.moveTo(x,f+17);g.lineTo(x+9,f+26);g.lineTo(x,f+35);g.lineTo(x-9,f+26);g.closePath();g.fill()}}for(const q of plats){let y=f-q.y;g.fillStyle='#152d3d';g.fillRect(q.x,y,q.w,30);g.fillStyle='#e4c86f';g.fillRect(q.x,y,q.w,8);for(let x=q.x+14;x<q.x+q.w;x+=28){g.fillStyle='#57dcd4';g.beginPath();g.arc(x,y+18,4,0,Math.PI*2);g.fill()}}g.restore()}function drawHero(f){g.save();g.translate(-cam,0);g.globalAlpha=p.inv>0&&Math.floor(t*14)%2?.35:1;const x=p.x,y=p.y;g.fillStyle='#09141f';g.beginPath();g.moveTo(x+18,y);g.lineTo(x+4,y+20);g.lineTo(x+10,y+48);g.lineTo(x+26,y+48);g.lineTo(x+33,y+20);g.closePath();g.fill();g.fillStyle='#f0cc69';g.fillRect(x+8,y+23,20,9);g.fillStyle='#1d84a0';g.fillRect(x+10,y+34,16,26);g.fillStyle='#f4e3ad';g.beginPath();g.moveTo(x+8,y+12);g.lineTo(x-2,y+2);g.lineTo(x+12,y+5);g.closePath();g.fill();g.beginPath();g.moveTo(x+28,y+12);g.lineTo(x+38,y+2);g.lineTo(x+24,y+5);g.closePath();g.fill();g.fillStyle='#75ffeb';g.fillRect(x+9,y+14,5,4);g.fillRect(x+22,y+14,5,4);if(p.atk>0){g.strokeStyle='#ffe58b';g.lineWidth=6;g.beginPath();g.arc(x+18+p.face*18,y+34,36,p.face>0?-.9:Math.PI-.9,p.face>0?.9:Math.PI+.9);g.stroke()}if(p.dash>0){g.globalAlpha=.25;g.fillStyle='#7fffe8';g.fillRect(x-p.face*38,y+12,30,36)}g.restore()}function drawEnemies(f){g.save();g.translate(-cam,0);for(const e of enemies){if(e.hp<=0)continue;let y=f-58;g.fillStyle=e.hit>0?'#7fffe8':e.kind===2?'#704067':'#5a3b78';g.beginPath();g.moveTo(e.x-22,y+54);g.lineTo(e.x-18,y+8);g.lineTo(e.x,y-8);g.lineTo(e.x+18,y+8);g.lineTo(e.x+22,y+54);g.closePath();g.fill();g.strokeStyle='#e1bd62';g.lineWidth=3;g.stroke();g.fillStyle='#f3df9f';g.beginPath();g.moveTo(e.x-12,y+7);g.lineTo(e.x-25,y-8);g.lineTo(e.x-7,y-3);g.closePath();g.fill();g.beginPath();g.moveTo(e.x+12,y+7);g.lineTo(e.x+25,y-8);g.lineTo(e.x+7,y-3);g.closePath();g.fill();g.fillStyle='#78fff0';g.fillRect(e.x-10,y+14,5,4);g.fillRect(e.x+5,y+14,5,4)}g.restore()}function drawEchoes(f){g.save();g.translate(-cam,0);for(const e of echoes){if(!e.on)continue;const y=f-e.y,r=16+Math.sin(t*4+e.x)*3;g.strokeStyle='#74fff0';g.lineWidth=4;g.beginPath();g.arc(e.x,y,r,0,Math.PI*2);g.stroke();g.strokeStyle='rgba(255,222,105,.65)';g.beginPath();g.arc(e.x,y,r+10,0,Math.PI*2);g.stroke();g.fillStyle='#f4d66c';g.beginPath();g.arc(e.x,y,6,0,Math.PI*2);g.fill()}g.restore()}function render(){const f=floorTop();g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);sky();water(f);g.save();g.translate(-cam*.28,0);for(let i=-1;i<11;i++)palaceUnit(i*520,f,1);g.restore();decorations(f);terrain(f);drawEchoes(f);drawEnemies(f);drawHero(f);if(p.echo===3&&p.x>4700){g.fillStyle='rgba(5,14,24,.83)';g.fillRect(W/2-190,24,380,50);g.strokeStyle='#c9aa55';g.strokeRect(W/2-190,24,380,50);g.fillStyle='#f0d58a';g.font='17px Georgia,serif';g.textAlign='center';g.fillText('LE SANCTUAIRE RÉPOND',W/2,55);g.textAlign='left'}}function loop(now){try{const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);render();status.textContent='MOTEUR ACTIF · V541 · '+Math.round(1/dt)+' FPS'}catch(err){status.textContent='ERREUR · '+String(err).slice(0,70)}requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
