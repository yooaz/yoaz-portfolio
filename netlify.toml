[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# ─────────────────────────────────────────────────────────────
# HEADERS DE SÉCURITÉ (tous les chemins)
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS (force HTTPS 2 ans + preload)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Protection clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Bloque MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy moderne
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy — restreint les APIs puissantes
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self \"https://yoaz-art.myshopify.com\"), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()"
    # Protection XSS (legacy mais utile pour vieux navigateurs)
    X-XSS-Protection = "1; mode=block"
    # CORP — isole les ressources
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "cross-origin"
    # Bloque prefetching DNS sensible
    X-DNS-Prefetch-Control = "on"
    # CSP complète — autorise analytics, Shopify, Formspree, Vimeo, fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://sdks.shopifycdn.com https://*.shopify.com https://*.myshopify.com https://player.vimeo.com https://w.behold.so; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://sdks.shopifycdn.com; font-src 'self' data: https://fonts.gstatic.com https://sdks.shopifycdn.com; img-src 'self' data: https: blob:; media-src 'self' https://player.vimeo.com https://*.vimeocdn.com; frame-src 'self' https://www.googletagmanager.com https://player.vimeo.com https://*.myshopify.com; connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com https://stats.g.doubleclick.net https://*.myshopify.com https://yoaz-art.myshopify.com https://sdks.shopifycdn.com https://formspree.io https://api.instagram.com https://graph.instagram.com https://feeds.behold.so https://w.behold.so https://behold.pictures https://cdn2.behold.pictures; form-action 'self' https://formspree.io https://yoaz-art.myshopify.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;"

# ─────────────────────────────────────────────────────────────
# CACHE — Assets versionnés : 1 an immutable
# ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML : revalider à chaque fois
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fichiers SEO : cache court (pour mise à jour rapide)
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# ─────────────────────────────────────────────────────────────
# REDIRECTIONS SEO (canonique, HTTPS, www)
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "https://www.yoaz.fr/*"
  to = "https://yoaz.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://yoaz.fr/*"
  to = "https://yoaz.fr/:splat"
  status = 301
  force = true

# Fallback 404 (si aucune page match)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ─────────────────────────────────────────────────────────────
# COMPRESSION (Netlify le fait automatiquement, mais on s'assure)
# ─────────────────────────────────────────────────────────────
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
