name: Menu Shaker - verify Gradle wrapper

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Build verified Gradle 9.6.0 wrapper kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrapper-kit/gradle/wrapper
          curl --fail --location --retry 3 --output wrapper-kit/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradle/wrapper/gradle-wrapper.jar
          curl --fail --location --retry 3 --output wrapper-kit/gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradlew
          curl --fail --location --retry 3 --output wrapper-kit/gradlew.bat \
            https://raw.githubusercontent.com/gradle/gradle/v9.6.0/gradlew.bat
          chmod +x wrapper-kit/gradlew
          cat > wrapper-kit/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  wrapper-kit/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          grep -q 'gradle-9.6.0-bin.zip' wrapper-kit/gradle/wrapper/gradle-wrapper.properties
          grep -q 'bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01' wrapper-kit/gradle/wrapper/gradle-wrapper.properties
          test -x wrapper-kit/gradlew
          test -s wrapper-kit/gradlew.bat
      - name: Upload verified wrapper kit
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.6.0-verified-kit
          path: wrapper-kit
          if-no-files-found: error
          retention-days: 1
