name: Menu Shaker - verify Gradle wrapper

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Gradle 9.6.0 wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output gradle-wrapper.jar \
            https://services.gradle.org/distributions/gradle-9.6.0-wrapper.jar
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle-wrapper.jar" | sha256sum --check --strict
          test "$(stat -c%s gradle-wrapper.jar)" -gt 40000
      - name: Upload verified wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.6.0-verified
          path: gradle-wrapper.jar
          if-no-files-found: error
          retention-days: 1
