<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Palace of Signs · V539 launch test</title><style>html,body{margin:0;height:100%;background:#08121c;color:#f2df9a;font-family:system-ui,sans-serif;overflow:hidden}#wrap{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}header{padding:12px 16px;border-bottom:1px solid #8b7440;background:#07101a}header b{letter-spacing:.08em}header small{display:block;color:#8fffe9;margin-top:4px}canvas{width:100%;height:100%;touch-action:none;background:linear-gradient(#17324c,#0b1724)}#hud{position:absolute;top:68px;left:14px;background:#07101acc;border:1px solid #8b7440;padding:8px 10px;font-size:12px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px;background:#07101a;border-top:1px solid #8b7440}.controls button,#play{min-height:56px;border:1px solid #b69a55;background:#102334;color:#f5e5a6;border-radius:10px;font-size:18px}#status{color:#8fffe9}#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#07101a}#gate div{width:min(420px,calc(100vw - 32px));padding:24px;border:1px solid #b69a55;background:#0b1724;text-align:center}#gate h1{font-family:Georgia,serif;letter-spacing:.08em;color:#f0d58a}#play{width:100%;font-weight:700}#gate small{display:block;margin-top:10px;color:#8fffe9}</style></head><body><div id="gate"><div><h1>PALACE OF SIGNS</h1><p>Test V539 Safari/iPad. Appuie sur JOUER pour lancer le moteur.</p><button id="play">JOUER</button><small id="gateStatus">MOTEUR PRÊT · EN ATTENTE DU TOUCHER</small></div></div><div id="wrap"><header><b>PALACE OF SIGNS · V539 LAUNCH TEST</b><small id="status">Safari JS : prêt</small></header><canvas id="c"></canvas><div class="controls"><button data-k="l">◀</button><button data-k="r">▶</button><button data-k="j">SAUT</button><button data-k="a">ATTAQUE</button></div></div><div id="hud">x:<span id="x">120</span> · frames:<span id="f">0</span></div><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d');let W=0,H=0,f=0,last=performance.now(),started=false;const p={x:120,y:0,vx:0,vy:0,on:true,atk:0};const keys={};function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=c.width=Math.max(1,Math.floor(r.width*d));H=c.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function start(){if(started)return;started=true;document.getElementById('status').textContent='Safari JS : OK · moteur lancé';document.getElementById('gateStatus').textContent='MOTEUR LANCÉ · CONTRÔLES ACTIFS';const g=document.getElementById('gate');g.style.display='none';last=performance.now();requestAnimationFrame(loop)}const play=document.getElementById('play');play.addEventListener('click',start,{once:true});play.addEventListener('touchend',e=>{e.preventDefault();start()},{once:true,passive:false});play.addEventListener('pointerup',start,{once:true});for(const b of document.querySelectorAll('.controls button')){const k=b.dataset.k;for(const ev of ['pointerdown','touchstart'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=1},{passive:false});for(const ev of ['pointerup','pointercancel','touchend'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=0;if(k==='j'&&p.on){p.vy=-420;p.on=false}if(k==='a')p.atk=.18},{passive:false})}addEventListener('keydown',e=>{if(!started)start();if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key===' '&&p.on){p.vy=-420;p.on=false}if(e.key.toLowerCase()==='j')p.atk=.18});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});function loop(t){try{const d=Math.min(devicePixelRatio||1,2),dt=Math.min(.033,(t-last)/1000);last=t;f++;p.vx+=(keys.r-keys.l)*1100*dt;p.vx*=Math.pow(.002,dt);p.x+=p.vx*dt;p.vy+=980*dt;p.y+=p.vy*dt;const w=W/d,h=H/d,floor=h-92;if(p.y>floor-56){p.y=floor-56;p.vy=0;p.on=true}p.x=Math.max(20,Math.min(w-40,p.x));p.atk=Math.max(0,p.atk-dt);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#d4b45e';ctx.fillRect(0,h-92,w,8);ctx.fillStyle='#6de8ff';ctx.fillRect(p.x,p.y,30,56);if(p.atk>0){ctx.strokeStyle='#ffd96a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x+34,p.y+25,28,-1,1);ctx.stroke()}ctx.fillStyle='#d1f7ff';ctx.font='18px system-ui';ctx.fillText('Si ceci bouge après JOUER, Safari exécute correctement le moteur.',20,36);document.getElementById('x').textContent=Math.round(p.x);document.getElementById('f').textContent=f}catch(err){document.getElementById('status').textContent='ERREUR · '+String(err).slice(0,80)}requestAnimationFrame(loop)}})();</script></body></html>
