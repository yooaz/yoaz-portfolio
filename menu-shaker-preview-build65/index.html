lt="Explorer"><div class="cap">Explorer</div></section><section class="screen"><img src="assets/03-carte.webp" alt="Carte"><div class="cap">Carte</div></section><section class="screen"><img src="assets/04-recette.webp" alt="Recette"><div class="cap">Recette</div></section><section class="screen"><img src="assets/05-mon-bar.webp" alt="Mon Bar"><div class="cap">Mon Bar</div></section><section class="screen"><img src="assets/06-favoris.webp" alt="Favoris"><div class="cap">Favoris</div></section></div><div class="note">Touchez les onglets en bas pour parcourir la preview.</div></div></main><nav><button>Accueil</button><button>Explorer</button><button>Carte</button><button>Recette</button><button>Mon Bar</button><button>Favoris</button></nav><script>const b=[...document.querySelectorAll('button')],s=[...document.querySelectorAll('.screen')];function show(i){s.forEach((x,j)=>x.classList.toggle('active',j===i));b.forEach((x,j)=>x.classList.toggle('active',j===i));scrollTo({top:0,behavior:'smooth'})}b.forEach((x,i)=>x.onclick=()=>show(i));show(0)</script></body></html>
