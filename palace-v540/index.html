<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Palace of Signs · V540 Core Rebuild</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#f3df9e;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0;display:grid;grid-template-rows:52px 1fr 76px}header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#07111df2;border-bottom:1px solid #b99a4f;z-index:4}header b{font-family:Georgia,serif;letter-spacing:.08em}#status{font-size:11px;color:#82fff0}#stage{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none;background:#173b58}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:8px;background:#07111df2;border-top:1px solid #b99a4f;z-index:5}.controls button{border:1px solid #d3b45d;background:#102a3b;color:#fff0ad;border-radius:12px;font-size:17px;font-weight:700;touch-action:none}.controls button:active{background:#1c4961}.hud{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:3}.pill{padding:7px 9px;border:1px solid #d3b45d;background:#07111dcc;border-radius:8px;font-size:11px}.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#fff;background:#07111d;z-index:8}.fallback strong{color:#f3df9e;display:block;font-size:24px;font-family:Georgia,serif}.fallback span{display:block;margin-top:8px;color:#82fff0;font-size:12px}</style></head><body><div id="app"><header><b>PALACE OF SIGNS · V540</b><span id="status">JS BLOQUÉ</span></header><div id="stage"><div id="fallback" class="fallback"><div><strong>PALACE OF SIGNS</strong><span>Si ce message reste affiché, cette URL bloque JavaScript.</span></div></div><canvas id="game"></canvas><div class="hud"><div class="pill">VIE <span id="life">♥♥♥♥</span></div><div class="pill">ÉCHOS <span id="score">0</span>/3</div></div></div><div class="controls"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="jump">SAUT</button><button data-k="attack">ATTAQUE</button></div></div><script>(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),status=document.getElementById('status'),fallback=document.getElementById('fallback'),lifeEl=document.getElementById('life'),scoreEl=document.getElementById('score');if(!x){status.textContent='CANVAS INDISPONIBLE';return}fallback.remove();status.textContent='MOTEUR ACTIF';let W=0,H=0,D=1,last=performance.now(),time=0,cam=0;const world=3600,ground=92;const keys={left:0,right:0};const p={x:160,y:0,vx:0,vy:0,w:34,h:58,on:0,face:1,life:4,atk:0,inv:0,echo:0};const platforms=[{x:0,w:720,y:0},{x:920,w:560,y:0},{x:1660,w:720,y:0},{x:2570,w:1030,y:0},{x:760,w:120,y:90},{x:1505,w:120,y:120},{x:2400,w:130,y:82}];const echoes=[{x:640,y:45,on:1},{x:1450,y:80,on:1},{x:2480,y:48,on:1}];const enemies=[{x:1110,hp:2,dir:1,hit:0},{x:1920,hp:3,dir:-1,hit:0},{x:2950,hp:3,dir:1,hit:0}];function resize(){const r=c.getBoundingClientRect();D=Math.min(window.devicePixelRatio||1,2);W=Math.max(1,r.width);H=Math.max(1,r.height);c.width=Math.floor(W*D);c.height=Math.floor(H*D);x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();function rects(a,b){return a.x<a.x+b.w&&a.x+a.w>b.x&&a.y<a.y+b.h&&a.y+a.h>b.y}function hurt(kb){if(p.inv>0)return;p.life--;p.inv=1;p.vx=kb;p.vy=-260;if(p.life<=0){p.life=4;p.x=160;p.y=0;p.vx=p.vy=0;p.echo=0;echoes.forEach(e=>e.on=1)}lifeEl.textContent='♥'.repeat(p.life)+'♡'.repeat(4-p.life)}function action(k,on){if(k==='left'||k==='right'){keys[k]=on?1:0;return}if(!on)return;if(k==='jump'&&p.on){p.vy=-520;p.on=0}if(k==='attack'&&p.atk<=0)p.atk=.22}document.querySelectorAll('.controls button').forEach(b=>{const k=b.dataset.k;['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();action(k,1)},{passive:false}));['pointerup','pointercancel','touchend'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();action(k,0)},{passive:false}))});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')action('left',1);if(e.key==='ArrowRight'||e.key==='d')action('right',1);if(e.code==='Space'||e.key==='ArrowUp')action('jump',1);if(e.key.toLowerCase()==='j')action('attack',1)});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')action('left',0);if(e.key==='ArrowRight'||e.key==='d')action('right',0)});function update(dt){time+=dt;p.atk=Math.max(0,p.atk-dt);p.inv=Math.max(0,p.inv-dt);let m=keys.right-keys.left;if(m)p.face=m;p.vx+=(m*340-p.vx)*Math.min(1,dt*11);if(!m)p.vx*=Math.pow(.005,dt);p.vy+=1320*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(0,Math.min(world-p.w,p.x));p.on=0;let floor=H-ground;for(const q of platforms){if(p.x+p.w>q.x&&p.x<q.x+q.w){const top=floor-q.y-p.h;if(p.vy>=0&&p.y<=top+22&&p.y+p.h>=top){p.y=top;p.vy=0;p.on=1}}}if(p.y>H+180){hurt(0);p.x=Math.max(100,p.x-240);p.y=0}for(const e of echoes){if(e.on&&Math.abs((p.x+p.w/2)-e.x)<55&&Math.abs((p.y+p.h/2)-(floor-e.y))<90){e.on=0;p.echo++;scoreEl.textContent=p.echo}}for(const e of enemies){if(e.hp<=0)continue;e.hit=Math.max(0,e.hit-dt);e.x+=e.dir*48*dt;if(e.x<980||e.x>3280)e.dir*=-1;const ey=floor-54;if(Math.abs(p.x-e.x)<55&&Math.abs((p.y+p.h/2)-ey)<55)hurt(p.x<e.x?-280:280);if(p.atk>0&&e.hit<=0&&Math.abs((p.x+p.face*46)-e.x)<72&&Math.abs((p.y+p.h/2)-ey)<72){e.hp--;e.hit=.25;p.atk=0;e.x+=p.face*28}}cam+=(Math.max(0,Math.min(world-W,p.x-W*.38))-cam)*Math.min(1,dt*5)}function drawPalace(floor){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5bbce8');g.addColorStop(.55,'#2d7095');g.addColorStop(1,'#0a2438');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(-cam*.18,0);for(let i=-1;i<8;i++){let bx=i*430;x.fillStyle='rgba(245,233,194,.88)';x.fillRect(bx+90,floor-310,250,260);x.fillStyle='#d5b55e';x.fillRect(bx+78,floor-320,274,18);x.beginPath();x.fillStyle='#f5e9c2';x.arc(bx+215,floor-310,92,Math.PI,0);x.fill();x.fillStyle='#163d5a';for(let a=0;a<3;a++){x.beginPath();x.arc(bx+145+a*70,floor-125,28,Math.PI,0);x.fillRect(bx+117+a*70,floor-125,56,80);x.fill()}x.strokeStyle='#d5b55e';x.lineWidth=5;x.strokeRect(bx+90,floor-310,250,260)}x.restore();x.fillStyle='#0a6582';x.fillRect(0,floor+8,W,H-floor);x.strokeStyle='#7fffe8';x.globalAlpha=.42;for(let y=floor+18;y<H;y+=18){x.beginPath();x.moveTo(0,y+Math.sin(time*2+y)*3);x.lineTo(W,y);x.stroke()}x.globalAlpha=1}function render(){x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,W,H);const floor=H-ground;drawPalace(floor);x.save();x.translate(-cam,0);for(const q of platforms){const py=floor-q.y;x.fillStyle='#1b2f3d';x.fillRect(q.x,py,q.w,ground+q.y);x.fillStyle='#e2c56e';x.fillRect(q.x,py,q.w,10);for(let k=q.x+18;k<q.x+q.w;k+=58){x.fillStyle='#72d9d3';x.beginPath();x.arc(k,py+22,5,0,Math.PI*2);x.fill()}}for(const e of echoes){if(!e.on)continue;x.strokeStyle='#7fffe8';x.lineWidth=4;x.beginPath();x.arc(e.x,floor-e.y,18+Math.sin(time*4)*3,0,Math.PI*2);x.stroke();x.fillStyle='#f5d86a';x.beginPath();x.arc(e.x,floor-e.y,6,0,Math.PI*2);x.fill()}for(const e of enemies){if(e.hp<=0)continue;const ey=floor-54;x.fillStyle=e.hit>0?'#7fffe8':'#6d3a88';x.fillRect(e.x-20,ey-34,40,54);x.fillStyle='#f0d58a';x.fillRect(e.x-12,ey-20,7,7);x.fillRect(e.x+5,ey-20,7,7)}x.globalAlpha=p.inv>0&&Math.floor(time*14)%2?0.35:1;x.fillStyle='#0c1724';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#f0d58a';x.fillRect(p.x+6,p.y+8,22,18);x.fillStyle='#55d8ef';x.fillRect(p.x+8,p.y+31,18,25);if(p.atk>0){x.strokeStyle='#fff1a8';x.lineWidth=6;x.beginPath();x.arc(p.x+p.w/2+p.face*22,p.y+30,34,p.face>0?-.9:Math.PI-.9,p.face>0?.9:Math.PI+.9);x.stroke()}x.globalAlpha=1;x.restore();if(p.echo===3){x.fillStyle='rgba(7,17,29,.84)';x.fillRect(W/2-175,24,350,46);x.fillStyle='#f0d58a';x.font='16px Georgia,serif';x.textAlign='center';x.fillText('LES TROIS ÉCHOS SONT ÉVEILLÉS',W/2,53);x.textAlign='left'}}function loop(t){try{const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);render();status.textContent='MOTEUR ACTIF · '+Math.round(1/dt)+' FPS'}catch(err){status.textContent='ERREUR · '+String(err).slice(0,80)}requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
