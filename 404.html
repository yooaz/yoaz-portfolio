<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Page introuvable | Yoaz</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111008;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:'Space Mono',monospace}
.num{font-family:'Bebas Neue',sans-serif;font-size:clamp(8rem,20vw,16rem);line-height:1;letter-spacing:-.02em;color:#e8001c;opacity:.15;position:absolute}
.content{position:relative;z-index:1}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,6vw,4rem);letter-spacing:.05em;margin-bottom:.5rem}
p{font-size:.7rem;letter-spacing:.1em;color:rgba(17,16,8,.5);margin-bottom:2rem}
a{display:inline-block;background:#e8001c;color:#fff;font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:.9rem 2rem;text-decoration:none;transition:background .3s}
a:hover{background:#111008}
</style>
</head>
<body>
<div class="num">404</div>
<div class="content">
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée.</p>
  <a href="/">← Retour à l'accueil</a>
</div>
</body>
</html>
